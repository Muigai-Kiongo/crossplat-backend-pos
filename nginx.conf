server {
    listen 80;
    server_name localhost;
    
    # Set the document root
    root /var/www/html;
    index index.php index.html index.htm;

    # Route default web requests
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Route API requests targeting /public/api/
    # If the file exists, serve it, otherwise forward to an index or handled by fastcgi if it's a php file
    location /public/api/ {
        try_files $uri $uri/ /public/api/index.php?$query_string;
    }

    # Forward all .php files to the PHP-FPM service (app:9000)
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_index index.php;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
